---
variants:
  - notification-plugin

overwrites:
  '["Notification"]["tpl-notification-notify-service-ntfy"]["states"]': [ "Critical", "OK", "Unknown", "Warning"]
  '["Notification"]["tpl-notification-notify-service-ntfy"]["vars"]["notify_service_ntfy_datetime"]': '$icinga.short_date_time$'
  '["Notification"]["tpl-notification-notify-service-ntfy"]["vars"]["notify_service_ntfy_host_displayname"]': '$host.display_name$'
  '["Notification"]["tpl-notification-notify-service-ntfy"]["vars"]["notify_service_ntfy_hostname"]': '$host.name$'
  '["Notification"]["tpl-notification-notify-service-ntfy"]["vars"]["notify_service_ntfy_notification_author"]': '$notification.author$'
  '["Notification"]["tpl-notification-notify-service-ntfy"]["vars"]["notify_service_ntfy_notification_comment"]': '$notification.comment$'
  '["Notification"]["tpl-notification-notify-service-ntfy"]["vars"]["notify_service_ntfy_notification_type"]': '$notification.type$'
  '["Notification"]["tpl-notification-notify-service-ntfy"]["vars"]["notify_service_ntfy_service_displayname"]': '$service.display_name$'
  '["Notification"]["tpl-notification-notify-service-ntfy"]["vars"]["notify_service_ntfy_service_output"]': '$service.output$'
  '["Notification"]["tpl-notification-notify-service-ntfy"]["vars"]["notify_service_ntfy_service_state"]': '$service.state$'
  '["Notification"]["tpl-notification-notify-service-ntfy"]["vars"]["notify_service_ntfy_servicename"]': '$service.name$'
