# Service groups of the LF priority levels. `tools/build-service-groups` turns
# this file into the ServiceGroup objects in all-the-rest.json, run it after
# changing this file or a Service Set.
#
# A service of a Service Set gets its group from the first matching entry in
# `service_name_overrides`, otherwise from the group listing its service
# template (without `tpl-service-` and a `-sudo`, `-windows` or `-no-agent`
# suffix, shell-style wildcards allowed). A service that is not part of a Service
# Set (created by hand, from a Service Template only) gets its group from the
# first matching rule in `hand_made_services`; names are matched case-sensitive.
#
# The levels:
# P1: something is down now or will be within hours, act immediately.
# P2: still running, but the next failure is fatal (backups, redundancy,
#     certificates, hardware), fix it today.
# P3: patches, security and configuration, fix within weeks.
# P4: tuning and capacity, look at it when there is time.

groups:
  - object_name: 'lf-p1-availability'
    display_name: 'LF P1 Availability: something is down now or will be within hours, act immediately'
    templates:
