# Service Set members whose group differs from the one of their template.
service_name_overrides:
  - group: 'lf-p2-resilience'
    regex: 'dump|borg|duba|Veeam|Duplicati|Long Running|nextcloud-jobs|scan-files|moodle-cron|rsyncd|DFS Replication|Intersite Messaging|certmonger|acme-sh|chronyd|ntpd|timesyncd|nut-monitor|glusterd'
  - group: 'lf-p3-hygiene'
    regex: 'security-update|update-and-reboot|aidecheck|lynis|fangfrisch|freshclam|clamav-daemon|clamd@|grav-update|grav-selfupgrade|nextcloud-app-update|director-housekeeping|ipa-healthcheck|tuned|fail2ban|jcagent|snmpd|filebeat|logstash.service|rsyslog|syslog-ng|gsad|gvmd|ospd-openvas|splunk|Windows Defender|5514'
  - group: 'lf-p4-performance'
    regex: '^Procs$'
  - group: 'lf-p2-resilience'
    regex: 'cron\.service|crond\.service|systemd-journald|Service - (CryptSvc|EventLog|EventSystem|gpsvc|MSDTC|ProfSvc|Schedule|SENS|UserManager|W32Time|WinRM)$'
  - group: 'lf-p3-hygiene'
    regex: 'auditd|debug-shell'

# Services outside the Service Sets. A rule only applies if no earlier rule
# matches, and never to a Service Set member of another group.
hand_made_services:
  - group: 'lf-p2-resilience'
    globs:
      - '*backup*'
      - '*dump*'
      - '*borg*'
      - '*cron*'
      - '*duba*'
      - '*restic*'
      - '*Synology Active Backup*'
      - '*MailStore*'
      - 'File Count*'
  - group: 'lf-p3-hygiene'
    globs:
      - '*compress*'
      - '*clean*'
      - '*housekeep*'
      - '*update*'
      - '*Version*'
      - '*Logfile*'
      - '*MySQL Query*'
      - '*matomo-*'
      - '*report*'
      - '*-sla.*'
      - 'File Size*'
      - 'MySQL - *'
      - 'VirusTotal Scan URL*'
      - 'WordPress*'
  - group: 'lf-p4-performance'
    globs:
      - 'Feed*'
      - 'Atlassian Statuspage*'
      - 'Statuspal*'
      - 'GitHub Status*'
      - 'Infomaniak Events*'
      - 'StatusIQ*'
  - group: 'lf-p2-resilience'
    globs:
      - 'Cert*'
      - 'File Age*'
      - 'SMART*'
      - 'XCA*'
      - '*smartd*'
      - '*OpenStack Quota*'
      - '*OpenStack Swift*'
  - group: 'lf-p1-availability'
    globs:
      - 'Disk Usage*'
      - 'DNS*'
      - 'Ping*'
      - 'UPS*'
