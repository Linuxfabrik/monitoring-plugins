name: 'Linuxfabrik: Build Windows (x86_64)'

# Started for every published release by lf-release.yml, with `publish`: builds the
# tag and attaches the signed ZIP and MSI to the release, from where the
# repository server publishes them to download.linuxfabrik.ch
# (build/publish-downloads.sh). Without `publish`, a manual run builds `main`.
#
# Always a run on `main`, never on the tag: the origin verification of the
# SignPath signing policy only accepts builds from the branch `main`.
# verify-version.sh makes sure the tag is reachable from there. Both signing
# requests wait for a manual approval.

on:
  workflow_dispatch:
    inputs:
      compile-plugins:
        description: 'Space-separated list of check plugins to compile and package, for example "cpu-usage feed scanrootkit". Leave empty to build all plugins.'
        required: false
        default: ''
      # target-distros:
      #   description: 'Space-separated list of operating systems to compile on and build packages for. Supported: `windows`. Cannot be empty.'
      #   required: true
      #   default: 'windows'
      version:
        description: 'Release version of the monitoring-plugins package in the form `X.Y.Z` (e.g. `3.0.0`), without leading `v`. Mirrors the GitHub release tag (`vX.Y.Z`) without its `v` prefix.'
        required: true
      package-iteration:
        description: 'Build iteration of this release version. Always `1` on the first build. Increment to `2`, `3`, ... only when re-building the same `X.Y.Z`, e.g. after fixing a packaging bug during the internal pre-release test.'
        required: true
        default: '1'
      publish:
        description: 'Build the tag `v<version>` instead of `main` and attach the signed ZIP and MSI to that release. Use an iteration the release does not have yet.'
        type: 'boolean'
        default: false

# modify the default permissions granted to the GITHUB_TOKEN
permissions:
  # SignPath documents that the token handed to its action needs `actions: read` to
  # read the job details and download the unsigned artifact
  actions: 'read'
  contents: 'read'

jobs:
  build-windows-x86_64:
    runs-on:
      - 'windows-2025'  # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 'Set environment variables for the build scripts'
        shell: 'bash'
        env:
          COMPILE_PLUGINS: '${{ inputs.compile-plugins }}'
          ITERATION: '${{ inputs.package-iteration }}'
          VERSION: '${{ inputs.version }}'
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$ITERATION" =~ ^[0-9]+$ ]]; then
            echo "::error::Not a release version and iteration: '$VERSION' '$ITERATION'"
            exit 1
          fi
          echo "LFMP_ARCH=x86_64" >> $GITHUB_ENV
          # accept either "a b c" or "a,b,c"
          echo "LFMP_COMPILE_PLUGINS=${COMPILE_PLUGINS//,/ }" >> $GITHUB_ENV
          echo "LFMP_PACKAGE_ITERATION=$ITERATION" >> $GITHUB_ENV
          echo "LFMP_VERSION=$VERSION" >> $GITHUB_ENV

          echo "LFMP_DIR_REPOS=$GITHUB_WORKSPACE/repos" >> $GITHUB_ENV
          echo "LFMP_DIR_COMPILED=$RUNNER_TEMP/lfmp/compiled" >> $GITHUB_ENV
          echo "LFMP_DIR_PACKAGED=$RUNNER_TEMP/lfmp/packaged" >> $GITHUB_ENV

      - name: 'Create working directories'
        shell: 'bash'
        run: |
          mkdir -p $LFMP_DIR_REPOS
          mkdir -p $LFMP_DIR_COMPILED
          mkdir -p $LFMP_DIR_PACKAGED/{in,out}

      - name: 'git clone https://github.com/Linuxfabrik/THIS-REPO'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          path: '${{ env.LFMP_DIR_REPOS }}/monitoring-plugins'
          ref: "${{ inputs.publish && format('v{0}', env.LFMP_VERSION) || '' }}"
          # Full history and tags are required so build/verify-version.sh can
          # confirm the checkout contains the code tagged vLFMP_VERSION (#1406).
          fetch-depth: 0

      - name: 'Debug'
        shell: 'bash'
        run: >
          /bin/bash
          $LFMP_DIR_REPOS/monitoring-plugins/build/debug.sh

      - name: 'Install python3.13'
        uses: 'actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0' # v7.1.0
        with:
          python-version: '3.13'

      # Every tool and library of the build comes from a hash-pinned requirements
      # file. setuptools and wheel go first: Nuitka is published as a source
      # distribution only, and so is PySmbClient in the plugins' lockfile. Both are
      # built without isolation, by the pinned setuptools and wheel, instead of by
      # whatever an isolated build would fetch.
      - name: 'Install the build backend (setuptools, wheel)'
        run: 'python.exe -m pip install --require-hashes --requirement ${{ github.workspace }}\repos\monitoring-plugins\.github\setuptools\requirements.txt'

      # ordered-set is for nuitka: "Nuitka:WARNING: Using very slow fallback for ordered sets, please install 'ordered-set' or 'orderedset' PyPI packages for best Python compile time performance."
      - name: 'Install Nuitka and ordered-set'
        run: 'python.exe -m pip install --require-hashes --no-build-isolation --requirement ${{ github.workspace }}\repos\monitoring-plugins\.github\nuitka\requirements.txt'

      # install 3rd party libraries for all check plugins
      - name: 'Install the libraries of the check plugins'
        run: 'python.exe -m pip install --require-hashes --no-build-isolation --requirement ${{ github.workspace }}\repos\monitoring-plugins\lockfiles\py313-windows\requirements.txt'

      - name: 'Verify Python installation'
        run: 'python.exe -m pip list'

      - name: 'Compile the check plugins'
        shell: 'bash'
        run: >
          /bin/bash
          $LFMP_DIR_REPOS/monitoring-plugins/build/compile-multiple.sh

      # The JEA endpoint setup ships with the plugins, in a folder of its own, so the ZIP
      # and the MSI (which takes check-plugins/** with its subfolders) both carry it.
      # See PLUGINS-WINDOWS.md. Quoted and without a glob: the paths are Windows paths with
      # backslashes, which Git Bash reads as escapes when it expands an unquoted `*`, so the
      # pattern matched nothing (verified with Git Bash 2.56 on Windows Server 2025).
      - name: 'Add the JEA endpoint setup'
        shell: 'bash'
        run: >
          mkdir -p "$LFMP_DIR_COMPILED/check-plugins/jea" &&
          cp -r "$LFMP_DIR_REPOS/monitoring-plugins/assets/windows-jea/." "$LFMP_DIR_COMPILED/check-plugins/jea/"

      - name: 'Upload the unsigned compiled plugins'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        id: 'upload-unsigned-compiled'
        with:
          path: '${{ env.LFMP_DIR_COMPILED }}/check-plugins/*'
          name: "lfmp-${{ env.LFMP_VERSION }}-${{ env.LFMP_PACKAGE_ITERATION }}.unsigned-compiled.windows.${{ env.LFMP_ARCH }}"
          if-no-files-found: 'error'

      # https://github.com/SignPath/github-actions/tree/main/actions/submit-signing-request
      # https://about.signpath.io/documentation/trusted-build-systems/github
      - name: 'Sign the compiled plugins'
        uses: 'signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627' # v2.3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '35067665-5434-42c5-9fa2-4c750069f161'
          project-slug: 'monitoring-plugins'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'compiled'
          github-artifact-id: '${{ steps.upload-unsigned-compiled.outputs.artifact-id }}'
          wait-for-completion: true
          # The release-signing policy waits for a manual approval in SignPath. The action's
          # default of 600 seconds fails the build when nobody approves within 10 minutes.
          wait-for-completion-timeout-in-seconds: 7200
          # note: the path is always relative to GITHUB_WORKSPACE (hardcoded in the signpath action)
          # and will be created if it does not exist
          output-artifact-directory: 'signed-compiled/'

      - name: 'Upload the signed compiled plugins'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          path: '${{ github.workspace }}/signed-compiled/*'
          name: "lfmp-${{ env.LFMP_VERSION }}-${{ env.LFMP_PACKAGE_ITERATION }}.signed-compiled.windows.${{ env.LFMP_ARCH }}"

      - name: 'Configure MSBuild in the workflow PATH for building .NET Framework applications'
        uses: 'microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57' # v3.0.0

      - name: 'Install WiX toolset, the packaging tool'
        # Pinned to 5.0.* because WiX 7 introduced the Open Source Maintenance Fee (OSMF)
        # EULA (https://wixtoolset.org/osmf/) that the build would otherwise have to accept.
        # 5.0.* matches the version used in the last successful release (v2.2.1).
        run: 'dotnet tool install --global wix --version 5.0.*'

      - name: 'Verify WiX installation'
        run: 'wix --version'

      - name: 'Create the wxs file for WiX'
        shell: 'bash'
        run: >
          /bin/bash
          $LFMP_DIR_REPOS/monitoring-plugins/build/create-wxs.sh

      - name: 'Create the package for Windows'
        run: >
          wix.exe build
          -arch x64
          -defaultcompressionlevel high
          ${{ env.LFMP_DIR_PACKAGED }}\in\lfmp.wxs
          -out ${{ env.LFMP_DIR_PACKAGED }}\out\linuxfabrik-monitoring-plugins.msi

      - name: 'Upload the unsigned package (msi)'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        id: 'upload-unsigned-packaged'
        with:
          path: '${{ env.LFMP_DIR_PACKAGED }}/out/*'
          name: "lfmp-${{ env.LFMP_VERSION }}-${{ env.LFMP_PACKAGE_ITERATION }}.unsigned-packaged.windows.${{ env.LFMP_ARCH }}"

      - name: 'Sign the package'
        uses: 'signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627' # v2.3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '35067665-5434-42c5-9fa2-4c750069f161'
          project-slug: 'monitoring-plugins'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'packaged'
          github-artifact-id: '${{ steps.upload-unsigned-packaged.outputs.artifact-id }}'
          wait-for-completion: true
          # The release-signing policy waits for a manual approval in SignPath. The action's
          # default of 600 seconds fails the build when nobody approves within 10 minutes.
          wait-for-completion-timeout-in-seconds: 7200
          # note: the path is always relative to GITHUB_WORKSPACE (hardcoded in the signpath action)
          # and will be created if it does not exist
          output-artifact-directory: 'signed-packaged/'

      - name: 'Upload the signed package (msi)'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          path: '${{ github.workspace }}/signed-packaged/*'
          name: "lfmp-${{ env.LFMP_VERSION }}-${{ env.LFMP_PACKAGE_ITERATION }}.signed-packaged.windows.${{ env.LFMP_ARCH }}"

  # Zips the two signed artifacts as download.linuxfabrik.ch serves them (the
  # SignPath output at the root of each zip, without the WiX debug symbols, which
  # do not belong on a public server), attests them and attaches them to the
  # release.
  publish:
    if: 'inputs.publish'
    needs: 'build-windows-x86_64'
    runs-on: 'ubuntu-24.04'
    permissions:
      attestations: 'write'
      contents: 'write'
      id-token: 'write'
    env:
      # validated in the build job
      ITERATION: '${{ inputs.package-iteration }}'
      VERSION: '${{ inputs.version }}'
    steps:
      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2' # v2.22.2
        with:
          egress-policy: 'audit'

      - name: 'Download the signed artifacts'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          path: '${{ runner.temp }}/artifacts'
          pattern: 'lfmp-*.signed-*.windows.x86_64'

      - name: 'Zip the signed artifacts'
        run: |
          mkdir "$RUNNER_TEMP/assets"
          for kind in compiled packaged; do
            name="lfmp-$VERSION-$ITERATION.signed-$kind.windows.x86_64"
            rm -f "$RUNNER_TEMP/artifacts/$name/linuxfabrik-monitoring-plugins.wixpdb"
            (cd "$RUNNER_TEMP/artifacts/$name" && zip --quiet --recurse-paths "$RUNNER_TEMP/assets/$name.zip" .)
          done
          ls -l "$RUNNER_TEMP/assets"

      - name: 'Attest the build provenance'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8' # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/assets/*'

      # No --clobber: an asset that exists already was published under that name,
      # and a rebuild takes the next iteration instead.
      - name: 'Attach the zips to the release'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: 'gh release upload "v$VERSION" "$RUNNER_TEMP"/assets/*.zip --repo "$GITHUB_REPOSITORY"'
