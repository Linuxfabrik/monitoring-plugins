name: 'Linuxfabrik: Deploy Documentation'

on:
  push:
    branches:
      - 'main'

permissions:
  contents: 'read'
  pages: 'write'
  id-token: 'write'

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43' # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Set up Python'
        uses: 'actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0' # v7.1.0
        with:
          python-version: '3.12'

      - name: 'Install dependencies'
        run: 'pip install --require-hashes --requirement .github/docs/requirements.txt'

      - name: 'Generate docs structure'
        run: 'python3 tools/build-docs'

      - name: 'Build documentation'
        run: 'mkdocs build --strict'

      - name: 'Upload Pages artifact'
        uses: 'actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9' # v5.0.0
        with:
          path: 'site'

  deploy:
    needs: 'build'
    runs-on: 'ubuntu-latest'
    environment:
      name: 'github-pages'
      url: '${{ steps.deployment.outputs.page_url }}'
    steps:
      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43' # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Deploy to GitHub Pages'
        id: 'deployment'
        uses: 'actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346' # v5.0.1
