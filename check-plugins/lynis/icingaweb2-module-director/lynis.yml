---
# The scan runs as an unprivileged user from a management host, so there is no sudo
# variant. To evaluate the audit a host runs on its own, use lynis-logfile.
variants:
  - linux

overwrites:
  # A network scan audits many hosts, up to a minute each.
  '["Command"]["cmd-check-lynis"]["timeout"]': '3600'
  '["ServiceTemplate"]["tpl-service-lynis"]["check_interval"]': '86400'
  '["ServiceTemplate"]["tpl-service-lynis"]["enable_perfdata"]': true
  # An audit runs for minutes and its findings do not change between two runs, so
  # retrying a soft problem would only repeat the same audit. The first result is the
  # final one.
  '["ServiceTemplate"]["tpl-service-lynis"]["max_check_attempts"]': 1
  '["ServiceTemplate"]["tpl-service-lynis"]["retry_interval"]': 3600
