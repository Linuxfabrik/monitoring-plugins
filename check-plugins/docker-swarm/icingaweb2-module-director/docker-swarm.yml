---
overwrites:
  '["Command"]["cmd-check-docker-swarm"]["command"]': '/usr/bin/sudo /usr/lib64/nagios/plugins/docker-swarm'
  '["Command"]["cmd-check-docker-swarm"]["timeout"]': 20
  '["ServiceTemplate"]["tpl-service-docker-swarm"]["enable_perfdata"]': true
  '["ServiceTemplate"]["tpl-service-docker-swarm"]["vars"]["docker_swarm_lengthy"]': true
  # --timeout covers all engine commands of a run; give it the room the command timeout
  # above allows, minus a margin so the plugin reports the timeout itself.
  '["ServiceTemplate"]["tpl-service-docker-swarm"]["vars"]["docker_swarm_timeout"]': 15
