variants:
  - linux

overwrites:
  # A large array needs tens of seconds to walk its LUN list (82 s for 697 LUNs in
  # pages of 100 on a Dorado 6000 V6), well beyond the default command timeout.
  '["Command"]["cmd-check-huawei-dorado-lun"]["timeout"]': 180
  '["ServiceTemplate"]["tpl-service-huawei-dorado-lun"]["check_interval"]': 900
  '["ServiceTemplate"]["tpl-service-huawei-dorado-lun"]["retry_interval"]': 30
  '["ServiceTemplate"]["tpl-service-huawei-dorado-lun"]["use_agent"]': false
  '["ServiceTemplate"]["tpl-service-huawei-dorado-lun"]["vars"]["criticality"]': 'A'
  '["ServiceTemplate"]["tpl-service-huawei-dorado-lun"]["vars"]["huawei_dorado_lun_lengthy"]': true
