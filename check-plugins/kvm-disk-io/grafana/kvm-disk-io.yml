apiVersion: grizzly.grafana.com/v1alpha1
kind: Dashboard
metadata:
  folder: linuxfabrik-monitoring-plugins
  name: kvm-disk-io
spec:
  schemaVersion: 42
  tags:
    - Linuxfabrik
    - Grizzly
    - static
  time:
    from: now-90d
    to: now
  timepicker:
    hidden: false
    refresh_intervals:
    - 1m
  timezone: browser
  title: kvm-disk-io
  editable: true
  liveNow: true
  refresh: 1m
  templating:
    list:
    - label: Command
      name: command
      query: SHOW MEASUREMENTS WITH MEASUREMENT =~ /.*kvm-disk-io.*/
      current:
        text: cmd-check-kvm-disk-io
        value: cmd-check-kvm-disk-io
      refresh: 1
      sort: 1
      type: query
    - label: Hostname
      name: hostname
      query: SHOW TAG VALUES FROM "$command" WITH KEY = "hostname"
      refresh: 1
      sort: 1
      type: query
    - label: Service
      name: service
      query: SHOW TAG VALUES FROM "$command" WITH KEY = "service" WHERE hostname = '$hostname'
      refresh: 1
      sort: 1
      type: query

  panels:

  # What each disk of each machine moved, averaged over the check's own
  # period. Read and write share the panel: same unit, same question, and
  # the ratio between them says what kind of load a machine produces.
  - title: kvm-disk-io - Throughput per Disk
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 0
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 1
          showPoints: never
          spanNulls: false
        decimals: 1
        min: 0
        unit: bytes
    options:
      legend:
        calcs:
        - first
        - min
        - mean
        - max
        - last
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        mode: multi
        sort: none

    targets:

    - alias: $tag_metric
      refId: throughput
      groupBy:
      - params:
        - $interval
        type: time
      - params:
        - previous
        type: fill
      - params:
        - metric
        type: tag
      measurement: $command
      resultFormat: time_series
      select:
      - - params:
          - value
          type: field
        - params: []
          type: mean
      tags:
      - key: hostname
        operator: '='
        value: $hostname
      - condition: AND
        key: service
        operator: '='
        value: $service
      - condition: AND
        key: metric
        operator: '=~'
        value: /(_read_bytes_per_second$|_write_bytes_per_second$)/

  # The same figure summed over every checked disk, which is what the
  # machines together ask of the host's storage. Kept apart from the
  # per-disk panel because a host total would dwarf the disks on one axis.
  - title: kvm-disk-io - Throughput of All Machines
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 8
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 1
          showPoints: never
          spanNulls: false
        decimals: 1
        min: 0
        unit: bytes
    options:
      legend:
        calcs:
        - first
        - min
        - mean
        - max
        - last
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        mode: multi
        sort: none

    targets:

    - alias: $tag_metric
      refId: total
      groupBy:
      - params:
        - $interval
        type: time
      - params:
        - previous
        type: fill
      - params:
        - metric
        type: tag
      measurement: $command
      resultFormat: time_series
      select:
      - - params:
          - value
          type: field
        - params: []
          type: mean
      tags:
      - key: hostname
        operator: '='
        value: $hostname
      - condition: AND
        key: service
        operator: '='
        value: $service
      - condition: AND
        key: metric
        operator: '=~'
        value: /(^read_bytes_per_second$|^write_bytes_per_second$)/

  # Requests rather than bytes. A machine doing many small requests loads
  # the backing store quite differently from one moving the same bytes in
  # few large ones, and only this panel tells the two apart.
  - title: kvm-disk-io - IOPS per Disk
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 16
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 1
          showPoints: never
          spanNulls: false
        decimals: 1
        min: 0
        unit: short
    options:
      legend:
        calcs:
        - first
        - min
        - mean
        - max
        - last
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        mode: multi
        sort: none

    targets:

    - alias: $tag_metric
      refId: iops
      groupBy:
      - params:
        - $interval
        type: time
      - params:
        - previous
        type: fill
      - params:
        - metric
        type: tag
      measurement: $command
      resultFormat: time_series
      select:
      - - params:
          - value
          type: field
        - params: []
          type: mean
      tags:
      - key: hostname
        operator: '='
        value: $hostname
      - condition: AND
        key: service
        operator: '='
        value: $service
      - condition: AND
        key: metric
        operator: '=~'
        value: /(_read_iops$|_write_iops$)/

  # How long a request took to complete, for reads, writes and both
  # together. This is where a disk that has stopped answering shows up,
  # and it is the panel to read when the throughput above went *down*.
  - title: kvm-disk-io - Latency per Disk
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 24
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 1
          showPoints: never
          spanNulls: false
        decimals: 1
        min: 0
        unit: ms
    options:
      legend:
        calcs:
        - first
        - min
        - mean
        - max
        - last
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        mode: multi
        sort: none

    targets:

    - alias: $tag_metric
      refId: await
      groupBy:
      - params:
        - $interval
        type: time
      - params:
        - previous
        type: fill
      - params:
        - metric
        type: tag
      measurement: $command
      resultFormat: time_series
      select:
      - - params:
          - value
          type: field
        - params: []
          type: mean
      tags:
      - key: hostname
        operator: '='
        value: $hostname
      - condition: AND
        key: service
        operator: '='
        value: $service
      - condition: AND
        key: metric
        operator: '=~'
        value: /_await$/
