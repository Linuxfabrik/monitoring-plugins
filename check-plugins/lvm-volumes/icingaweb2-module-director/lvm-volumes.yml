---
variants:
  - linux
  - sudo

overwrites:
  # The command timeout has to sit clearly above the plugin's own --timeout, which
  # defaults to 8 seconds. `lvs` reads every physical volume on the host and blocks in
  # an uninterruptible sleep on one that has stopped answering, so a run that hits its
  # deadline needs about 9 seconds including the interpreter start.
  '["Command"]["cmd-check-lvm-volumes"]["timeout"]': 20
  # A volume that lost a physical volume will not come up at the next boot, so this
  # sits in the same criticality band as the other storage checks.
  '["ServiceTemplate"]["tpl-service-lvm-volumes"]["check_interval"]': 300
  '["ServiceTemplate"]["tpl-service-lvm-volumes"]["enable_perfdata"]': true
  '["ServiceTemplate"]["tpl-service-lvm-volumes"]["retry_interval"]': 60
  '["ServiceTemplate"]["tpl-service-lvm-volumes"]["vars"]["criticality"]': 'A'
