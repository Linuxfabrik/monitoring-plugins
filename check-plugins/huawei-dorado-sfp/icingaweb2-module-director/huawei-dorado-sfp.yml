variants:
  - linux

overwrites:
  '["ServiceTemplate"]["tpl-service-huawei-dorado-sfp"]["check_interval"]': 300
  '["ServiceTemplate"]["tpl-service-huawei-dorado-sfp"]["retry_interval"]': 30
  '["ServiceTemplate"]["tpl-service-huawei-dorado-sfp"]["use_agent"]': false
  '["ServiceTemplate"]["tpl-service-huawei-dorado-sfp"]["vars"]["criticality"]': 'A'
  # A service listing every healthy item alongside the faulty one is unreadable on a
  # sizeable appliance, so the service set ships with the rows within the thresholds
  # hidden. Perfdata and alerting are unaffected.
  '["ServiceTemplate"]["tpl-service-huawei-dorado-sfp"]["vars"]["huawei_dorado_sfp_brief"]': true
