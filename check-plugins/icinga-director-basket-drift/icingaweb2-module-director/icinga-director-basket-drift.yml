  '["ServiceTemplate"]["tpl-service-icinga-director-basket-drift"]["check_interval"]': 86400
  '["ServiceTemplate"]["tpl-service-icinga-director-basket-drift"]["enable_perfdata"]': false
  '["ServiceTemplate"]["tpl-service-icinga-director-basket-drift"]["retry_interval"]': 300
