---
overwrites:
  '["Command"]["cmd-check-docker-container"]["command"]': '/usr/bin/sudo /usr/lib64/nagios/plugins/docker-container'
  '["Command"]["cmd-check-docker-container"]["timeout"]': 20
  '["ServiceTemplate"]["tpl-service-docker-container"]["enable_perfdata"]': true
  # --timeout covers all engine commands of a run; give it the room the command timeout
  # above allows, minus a margin so the plugin reports the timeout itself.
  '["ServiceTemplate"]["tpl-service-docker-container"]["vars"]["docker_container_timeout"]': 15
