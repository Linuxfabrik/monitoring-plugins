---
overwrites:
  '["Command"]["cmd-check-podman-image"]["command"]': '/usr/bin/sudo /usr/lib64/nagios/plugins/podman-image'
  '["Command"]["cmd-check-podman-image"]["timeout"]': 20
  '["ServiceTemplate"]["tpl-service-podman-image"]["enable_perfdata"]': true
  # A host can carry thousands of images, and a service listing every one of them
  # is unreadable, so the shipped service hides the images within the thresholds.
  # Perfdata and alerting are unaffected.
  '["ServiceTemplate"]["tpl-service-podman-image"]["vars"]["podman_image_brief"]': true
  # --timeout covers all engine commands of a run; give it the room the command timeout
  # above allows, minus a margin so the plugin reports the timeout itself.
  '["ServiceTemplate"]["tpl-service-podman-image"]["vars"]["podman_image_timeout"]': 15
