# Source: https://sandflysecurity.com/blog/linux-scales-ebpf-rootkit-detection-and-analysis, https://guardsix.com/blog/atomic-arch-zombie-package-apocalypse
# Published: 2026 Sandfly Security (2026-06-24), guardsix (2026-07-21), Atomic Arch AUR supply chain
# guardsix places the BPF maps directly under /sys/fs/bpf, Sandfly in a
# subdirectory derived from /etc/machine-id, hence the reduced confidence.
# Left out: /tmp/.cache (generic) and the randomly named binary and unit.
name: 'Scales eBPF rootkit'
files:
  - '/root/.local/bin/sudo'
  - '/sys/fs/bpf/hidden_inodes'
  - '/sys/fs/bpf/hidden_names'
  - '/sys/fs/bpf/hidden_pids'
dirs:
  - '/usr/bin/.local'
ksyms: []
discovered: '2026-06'
cl: 75
