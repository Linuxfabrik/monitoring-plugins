# Source: https://www.cert.ssi.gouv.fr/uploads/CERTFR-2021-CTI-005.pdf
# Published: 2021 ANSSI / CERT-FR (2021-01-27), Sandworm intrusion set, Centreon campaign
# The two /tmp entries are UNIX sockets. Left out: /etc/init.d/syslogd (exists
# on sysklogd and busybox systems), /etc/rc.d/syslogger (BSD), paths below the
# configurable install directory, the P.A.S. webshell and /bin/backup (SUID
# helper with a generic name).
name: 'Exaramel Linux backdoor (Sandworm)'
files:
  - '/etc/init/syslogd.conf'
  - '/etc/systemd/system/syslogd.service'
  - '/tmp/.applock'
  - '/tmp/.applocktx'
dirs: []
ksyms: []
discovered: '2018'
cl: 100
