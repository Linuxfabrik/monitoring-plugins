# Source: https://www.welivesecurity.com/2021/10/07/fontonlake-previously-unknown-malware-family-targeting-linux/
# Published: 2021 ESET (2021-10-07), also known as HCRootkit
# /proc/.dot3 and /proc/.inl are virtual files the rootkit creates. Left out:
# the module path, which depends on the kernel version, and /tmp/.tmp_<random>.
name: 'FontOnLake / HCRootkit LKM rootkit'
files:
  - '/etc/sysconfig/modules/ati_remote3.modules'
  - '/proc/.dot3'
  - '/proc/.inl'
dirs: []
ksyms: []
discovered: '2021'
cl: 100
