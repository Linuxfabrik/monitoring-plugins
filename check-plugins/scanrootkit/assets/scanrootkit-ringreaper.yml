# Source: https://github.com/MatheuZSecurity/RingReaper, https://www.darkreading.com/cyber-risk/ringreaper-sneaks-past-linux-edrs
# Published: 2025 MatheuZSecurity (upstream repository), covered by Dark Reading 2025
# The agent creates no fixed artifacts: agent.c only reads host files
# (/var/run/utmp, /proc/net/tcp, /dev/pts, /sys/fs/bpf) and deletes itself, and
# the operator picks the path it is dropped at. The single path below is the one
# the upstream deployment example uses, which is why this signature is scored as
# possible rather than confirmed. Detection of this agent belongs with runtime
# tooling that watches io_uring, not with a path scanner.
name: 'RingReaper io_uring post-exploitation agent'
files:
  - '/var/tmp/.X11'
dirs: []
ksyms: []
discovered: '2025-07'
cl: 50
