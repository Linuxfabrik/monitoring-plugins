# rkhunter runs this check on SunOS only. '/sbin/login' from its list is left out:
# the kit replaces the system login there, and a check for existence cannot tell
# the two apart. On Linux with /usr/sbin merged into /usr/bin (Fedora 44) it is the
# util-linux login and matched on every host.
name: 'SunOS Rootkit'
files:
  - '/etc/ld.so.hash'
  - '/lib/libext-2.so.7'
  - '/usr/bin/ssh2d'
  - '/bin/xlogin'
  - '/usr/lib/crth.o'
  - '/usr/lib/crtz.o'
  - '/lib/security/.config/sn'
  - '/lib/security/.config/lpsched'
  - '/dev/kmod'
  - '/dev/dos'
dirs: []
ksyms: []
