# Source: https://csirt.egi.eu/attacks-on-multiple-hpc-sites/
# Published: 2020 EGI CSIRT (incidents EGI20200421 and EGI2020512, last update 2020-05-18)
# EGI20200421 combined an XMR miner with Diamorphine LKMs, EGI2020512 left SUID
# shells and a log cleaner. Left out: /usr/bin/on_ac_power and
# /usr/share/sos/rh.pub (packaged files), the generic /tmp names, the /var/tmp/.lock
# directory itself, wildcards, and paths specific to the victim sites.
name: 'HPC site intrusions (EGI CSIRT 2020)'
files:
  - '/etc/fonts/.fonts'
  - '/etc/fonts/.low'
  - '/etc/terminfo/.terma'
  - '/etc/terminfo/.termb'
  - '/usr/lib/libocs.so'
  - '/usr/lib64/.lib/l64'
  - '/usr/share/aldi.so'
  - '/var/games/.terma'
  - '/var/games/.termb'
  - '/var/tmp/.lock/clogs'
  - '/var/tmp/.lock/cpa.h'
  - '/var/tmp/.lock/ologs'
dirs: []
ksyms: []
discovered: '2020-05'
cl: 100
