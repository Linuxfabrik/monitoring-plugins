---
overwrites:
  '["Command"]["cmd-check-podman-container"]["command"]': '/usr/bin/sudo /usr/lib64/nagios/plugins/podman-container'
  '["Command"]["cmd-check-podman-container"]["timeout"]': 20
  '["ServiceTemplate"]["tpl-service-podman-container"]["enable_perfdata"]': true
  # --timeout covers all engine commands of a run; give it the room the command timeout
  # above allows, minus a margin so the plugin reports the timeout itself.
  '["ServiceTemplate"]["tpl-service-podman-container"]["vars"]["podman_container_timeout"]': 15
