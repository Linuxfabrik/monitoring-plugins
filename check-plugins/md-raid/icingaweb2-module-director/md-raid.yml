---
overwrites:
  # A lost member is a reason to act, so this sits in the same criticality band as the
  # other storage checks. --lengthy is on, because the extra columns name the member the
  # kernel threw out, which is the first thing an administrator needs; an array count is
  # small enough that the output stays readable.
  '["ServiceTemplate"]["tpl-service-md-raid"]["enable_perfdata"]': true
  '["ServiceTemplate"]["tpl-service-md-raid"]["retry_interval"]': 60
  '["ServiceTemplate"]["tpl-service-md-raid"]["vars"]["criticality"]': 'A'
  '["ServiceTemplate"]["tpl-service-md-raid"]["vars"]["md_raid_lengthy"]': true
