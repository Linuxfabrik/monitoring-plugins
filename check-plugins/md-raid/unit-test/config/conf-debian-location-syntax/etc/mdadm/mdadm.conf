# Debian keeps its mdadm.conf here
HOMEHOST <system>

array /dev/md/root metadata=1.2
   # a comment inside the continuation does not end the line
   UUID=C84ECDA1.95171EB6.C53C5A5C.331737B3

ARR "/dev/md/home" UUID=842565f7-13fc8969-54b9776a-440b45ba
ARRAY <ignore> UUID=aaaaaaaa:bbbbbbbb:cccccccc:dddddddd
ARRAY /dev/md/scratch devices=/dev/sdx1,/dev/sdy1
ARRAY /dev/md/bad UUID=not-a-uuid
DEVICE partitions
ARRAY /dev/md/archive UUID=0f1e2d3c:4b5a6978:8796a5b4:c3d2e1f0 # trailing comment
