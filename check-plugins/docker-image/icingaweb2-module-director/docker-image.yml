---
overwrites:
  '["Command"]["cmd-check-docker-image"]["command"]': '/usr/bin/sudo /usr/lib64/nagios/plugins/docker-image'
  '["Command"]["cmd-check-docker-image"]["timeout"]': 20
  '["ServiceTemplate"]["tpl-service-docker-image"]["enable_perfdata"]': true
  # A host can carry thousands of images, and a service listing every one of them
  # is unreadable, so the shipped service hides the images within the thresholds.
  # Perfdata and alerting are unaffected.
  '["ServiceTemplate"]["tpl-service-docker-image"]["vars"]["docker_image_brief"]': true
