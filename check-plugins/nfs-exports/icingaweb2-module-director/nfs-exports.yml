---
overwrites:
  # The command timeout has to sit clearly above the plugin's own --timeout, which
  # defaults to 8 seconds. Being killed at 10 would replace the plugin's own answer,
  # which names every affected export, with a bare timeout.
  '["Command"]["cmd-check-nfs-exports"]["timeout"]': 20
  # A broken export is a share nobody can mount, which sits in the same criticality band
  # as the other storage checks. The export table only changes when someone changes it,
  # so a quarter of an hour is often enough; --lengthy is on, because the file an entry
  # comes from is the first thing an administrator needs when hunting a stray export.
  '["ServiceTemplate"]["tpl-service-nfs-exports"]["check_interval"]': 900
  '["ServiceTemplate"]["tpl-service-nfs-exports"]["enable_perfdata"]': true
  '["ServiceTemplate"]["tpl-service-nfs-exports"]["retry_interval"]': 180
  '["ServiceTemplate"]["tpl-service-nfs-exports"]["vars"]["criticality"]': 'A'
  '["ServiceTemplate"]["tpl-service-nfs-exports"]["vars"]["nfs_exports_lengthy"]': true
