---
variants:
  - linux
  - no-agent

overwrites:
  '["ServiceTemplate"]["tpl-service-openstack-quota"]["check_interval"]': 900
  '["ServiceTemplate"]["tpl-service-openstack-quota"]["enable_perfdata"]': true
  '["ServiceTemplate"]["tpl-service-openstack-quota"]["retry_interval"]': 60
  '["ServiceTemplate"]["tpl-service-openstack-quota"]["vars"]["criticality"]': 'B'
