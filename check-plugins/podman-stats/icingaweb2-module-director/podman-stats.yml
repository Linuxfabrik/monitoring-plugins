---
overwrites:
  '["Command"]["cmd-check-podman-stats"]["command"]': '/usr/bin/sudo /usr/lib64/nagios/plugins/podman-stats'
  '["Command"]["cmd-check-podman-stats"]["timeout"]': 20
  '["ServiceTemplate"]["tpl-service-podman-stats"]["enable_perfdata"]': true
  # --timeout covers all engine commands of a run; give it the room the command timeout
  # above allows, minus a margin so the plugin reports the timeout itself.
  '["ServiceTemplate"]["tpl-service-podman-stats"]["vars"]["podman_stats_timeout"]': 15
