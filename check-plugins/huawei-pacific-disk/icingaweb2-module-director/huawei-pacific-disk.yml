variants:
  - linux

overwrites:
  '["ServiceTemplate"]["tpl-service-huawei-pacific-disk"]["check_interval"]': 300
  '["ServiceTemplate"]["tpl-service-huawei-pacific-disk"]["retry_interval"]': 30
  '["ServiceTemplate"]["tpl-service-huawei-pacific-disk"]["use_agent"]': false
  '["ServiceTemplate"]["tpl-service-huawei-pacific-disk"]["vars"]["criticality"]': 'A'
  # A service listing every healthy item alongside the faulty one is unreadable on a
  # sizeable appliance, so the service set ships with the rows within the thresholds
  # hidden. Perfdata and alerting are unaffected.
  '["ServiceTemplate"]["tpl-service-huawei-pacific-disk"]["vars"]["huawei_pacific_disk_brief"]': true
