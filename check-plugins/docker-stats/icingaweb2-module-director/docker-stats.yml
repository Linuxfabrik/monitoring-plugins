---
overwrites:
  '["Command"]["cmd-check-docker-stats"]["command"]': '/usr/bin/sudo /usr/lib64/nagios/plugins/docker-stats'
  '["Command"]["cmd-check-docker-stats"]["timeout"]': 20
  '["ServiceTemplate"]["tpl-service-docker-stats"]["enable_perfdata"]': true
  # --timeout covers all engine commands of a run; give it the room the command timeout
  # above allows, minus a margin so the plugin reports the timeout itself.
  '["ServiceTemplate"]["tpl-service-docker-stats"]["vars"]["docker_stats_timeout"]': 15
