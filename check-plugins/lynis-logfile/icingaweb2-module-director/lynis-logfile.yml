---
# The report is readable by root only.
variants:
  - linux
  - sudo

overwrites:
  # The audit runs once a day, so an hourly look at its report is plenty.
  '["ServiceTemplate"]["tpl-service-lynis-logfile"]["check_interval"]': '3600'
  '["ServiceTemplate"]["tpl-service-lynis-logfile"]["enable_perfdata"]': true
