---
# The report is readable by root only.
variants:
  - linux
  - sudo

overwrites:
  # The audit runs once a day, so an hourly look at its report is plenty.
  '["ServiceTemplate"]["tpl-service-lynis-logfile"]["check_interval"]': '3600'
  '["ServiceTemplate"]["tpl-service-lynis-logfile"]["enable_perfdata"]': true
  # A non-OK result does not clear within seconds: an audit that is still writing the report
  # runs for a few minutes, and the report itself changes once a day. Retry at a pace that
  # lets a running audit finish.
  '["ServiceTemplate"]["tpl-service-lynis-logfile"]["retry_interval"]': 120
