---
overwrites:
  '["Command"]["cmd-check-docker-service"]["command"]': '/usr/bin/sudo /usr/lib64/nagios/plugins/docker-service'
  '["Command"]["cmd-check-docker-service"]["timeout"]': 30
  '["ServiceTemplate"]["tpl-service-docker-service"]["enable_perfdata"]': true
  '["ServiceTemplate"]["tpl-service-docker-service"]["vars"]["docker_service_lengthy"]': true
  # --check-distribution asks the swarm once per service, all within one --timeout, so
  # a swarm with many services needs more than the plugin default of 8 seconds. Kept
  # below the command timeout above.
  '["ServiceTemplate"]["tpl-service-docker-service"]["vars"]["docker_service_timeout"]': 25
