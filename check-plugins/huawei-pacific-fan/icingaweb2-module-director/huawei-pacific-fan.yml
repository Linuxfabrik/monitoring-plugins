variants:
  - linux

overwrites:
  '["ServiceTemplate"]["tpl-service-huawei-pacific-fan"]["check_interval"]': 300
  '["ServiceTemplate"]["tpl-service-huawei-pacific-fan"]["retry_interval"]': 30
  '["ServiceTemplate"]["tpl-service-huawei-pacific-fan"]["use_agent"]': false
  '["ServiceTemplate"]["tpl-service-huawei-pacific-fan"]["vars"]["criticality"]': 'A'
  # The node name alone does not order a spare part. Carrying the chassis serial
  # number in the service output means a fan can be identified from the
  # notification, without logging in to the appliance first.
  '["ServiceTemplate"]["tpl-service-huawei-pacific-fan"]["vars"]["huawei_pacific_fan_lengthy"]': true
