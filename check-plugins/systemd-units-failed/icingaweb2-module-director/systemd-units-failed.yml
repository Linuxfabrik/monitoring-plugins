---
overwrites:
  '["ServiceTemplate"]["tpl-service-systemd-units-failed"]["enable_perfdata"]': true
  # aidecheck.service fails on every AIDE finding and on every aborted run, which the
  # AIDE Service Set reports with the details. session-c*.scope are the scopes of
  # user sessions, which systemd marks as failed when a session ends abnormally.
  '["ServiceTemplate"]["tpl-service-systemd-units-failed"]["vars"]["systemd_units_failed_ignore"]':
    - 'aidecheck.service'
    - 'session-c*.scope'
