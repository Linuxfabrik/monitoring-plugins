variants:
  - linux

overwrites:
  # A large array needs tens of seconds to list its disks (33 s for 384 disks on a
  # Dorado 6000 V6), well beyond the default command timeout.
  '["Command"]["cmd-check-huawei-dorado-disk"]["timeout"]': 120
  '["ServiceTemplate"]["tpl-service-huawei-dorado-disk"]["check_interval"]': 300
  '["ServiceTemplate"]["tpl-service-huawei-dorado-disk"]["retry_interval"]': 30
  '["ServiceTemplate"]["tpl-service-huawei-dorado-disk"]["use_agent"]': false
  '["ServiceTemplate"]["tpl-service-huawei-dorado-disk"]["vars"]["criticality"]': 'A'
  # A service listing every healthy item alongside the faulty one is unreadable on a
  # sizeable appliance, so the service set ships with the rows within the thresholds
  # hidden. Perfdata and alerting are unaffected.
  '["ServiceTemplate"]["tpl-service-huawei-dorado-disk"]["vars"]["huawei_dorado_disk_brief"]': true
