[main]
# Not a boolean. The package manager's own parser raises on this while it is loading its
# plugins, and nothing on the way out catches that kind of error, so it dies with a
# Python traceback on every command. Verified against dnf 4.14 on RHEL 9, where
# `dnf list` ends in "ValueError: Not a boolean: maybe".
enabled = maybe
locklist = /etc/dnf/plugins/versionlock.list
