version = "1.0"

# `==` is a second spelling of `=` and `<>` one of `!=`. The package manager applies
# both and tells an exclude from a lock by the comparison rather than by the spelling,
# so this file holds one lock and one exclude. Verified against dnf5 5.4.2.1 on
# Fedora 44, where `dnf5 versionlock list` prints neither of them with an error and a
# lock written `==` blocks the transaction just like one written `=`.
[[packages]]
name = "bash"

[[packages.conditions]]
key = "evr"
comparator = "=="
value = "5.3.9-3.fc44"

[[packages]]
name = "curl"

[[packages.conditions]]
key = "evr"
comparator = "<>"
value = "8.18.0-4.fc44"
