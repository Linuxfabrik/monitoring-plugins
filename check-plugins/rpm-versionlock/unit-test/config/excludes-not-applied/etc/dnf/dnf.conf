[main]
gpgcheck=1
installonly_limit=3
excludepkgs=main-config-package
# Verified against dnf 4.14 on Rocky 9: `disable_excludes` takes the named scope out of
# force, `main` standing for the main configuration and anything else for a repository id.
# dnf5 5.4.2.1 knows neither the option nor a command line switch for it and excludes
# regardless, which is why the entries stay in the report.
disable_excludes=main,named-repo
