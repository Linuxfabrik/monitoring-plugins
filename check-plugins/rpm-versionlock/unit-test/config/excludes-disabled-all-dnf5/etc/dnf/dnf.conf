[main]
gpgcheck=1
installonly_limit=3
excludepkgs=main-config-package
# dnf 5 spells "every scope at once" `*` where dnf 4 spells it `all`. Verified against
# dnf5 5.4.2.1 on Fedora 44: with `excludepkgs` set, the excluded package is offered
# again as soon as this line is present, and the same holds for `disable_excludes=main`
# and for `disable_excludes=<repoid>`.
disable_excludes=*
