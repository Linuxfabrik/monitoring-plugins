---
variants:
  - linux
  - sudo

overwrites:
  # The command timeout has to sit clearly above the plugin's own --timeout, which
  # defaults to 8 seconds. `vgs` reads every physical volume on the host and blocks in
  # an uninterruptible sleep on one that has stopped answering, so a run that hits its
  # deadline needs about 9 seconds including the interpreter start.
  '["Command"]["cmd-check-lvm-volume-groups"]["timeout"]': 20
  # A group that lost a physical volume will not activate its volumes at the next boot,
  # so this sits in the same criticality band as the other storage checks. Free space
  # moves slowly, so a longer interval is enough for the rest of what it reports.
  '["ServiceTemplate"]["tpl-service-lvm-volume-groups"]["check_interval"]': 900
  '["ServiceTemplate"]["tpl-service-lvm-volume-groups"]["enable_perfdata"]': true
  '["ServiceTemplate"]["tpl-service-lvm-volume-groups"]["retry_interval"]': 60
  '["ServiceTemplate"]["tpl-service-lvm-volume-groups"]["vars"]["criticality"]': 'A'
