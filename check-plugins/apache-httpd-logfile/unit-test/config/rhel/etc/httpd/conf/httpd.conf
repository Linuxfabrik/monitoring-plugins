# Trimmed from the httpd.conf the RHEL family installs (httpd 2.4.62, Rocky 9).
# The directives this check reads are verbatim, including the TLS virtual host
# that conf.d/ssl.conf adds and whose ErrorLog must not be mistaken for the
# server-wide one.
ServerRoot "/etc/httpd"
Listen 80
Include conf.modules.d/*.conf
User apache
Group apache
ErrorLog "logs/error_log"
LogLevel warn
<IfModule log_config_module>
    CustomLog "logs/access_log" combined
</IfModule>
IncludeOptional conf.d/*.conf
<VirtualHost _default_:443>
ErrorLog logs/ssl_error_log
TransferLog logs/ssl_access_log
LogLevel warn
</VirtualHost>
