# The RHEL family from 8 on: ServerRoot is set, the drop-in directory is pulled
# in with IncludeOptional, and a site's own log is named relative to ServerRoot
# even though the file naming it lives one directory further down.
ServerRoot "/etc/httpd"
Listen 80
ErrorLog "logs/error_log"
LogLevel warn
IncludeOptional conf.d/*.conf
