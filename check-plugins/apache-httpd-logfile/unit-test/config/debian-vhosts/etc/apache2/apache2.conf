# The Debian family from 11 on: no ServerRoot in the file at all (the package
# compiles /etc/apache2 in), the log directory comes from a variable the envvars
# file exports, and the sites are symlinks from sites-enabled into
# sites-available.
ErrorLog ${APACHE_LOG_DIR}/error.log
LogLevel warn
IncludeOptional conf-enabled/*.conf
IncludeOptional sites-enabled/*.conf
