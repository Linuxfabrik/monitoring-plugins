---
overwrites:
  # Reading the services of a host takes 0.5 to 0.7 seconds (Icinga Director 1.12.1),
  # done for every host with overrides of its own, 4 hosts in parallel. 300 seconds
  # cover about 1500 such hosts.
  '["Command"]["cmd-check-icinga-director-overrides"]["timeout"]': 300
  '["ServiceTemplate"]["tpl-service-icinga-director-overrides"]["check_interval"]': 86400
  '["ServiceTemplate"]["tpl-service-icinga-director-overrides"]["enable_perfdata"]': false
  '["ServiceTemplate"]["tpl-service-icinga-director-overrides"]["retry_interval"]': 300
