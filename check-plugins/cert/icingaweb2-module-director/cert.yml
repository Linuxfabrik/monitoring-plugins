---
variants:
  - linux
  - no-agent

overwrites:
  '["Command"]["cmd-check-cert"]["timeout"]': 600
  '["ServiceTemplate"]["tpl-service-cert"]["check_interval"]': 86400
  '["ServiceTemplate"]["tpl-service-cert"]["retry_interval"]': 3600
  '["ServiceTemplate"]["tpl-service-cert"]["vars"]["cert_lengthy"]': true
  # The -no-agent template used to live in all-the-rest.json and carries this uuid in
  # every Director that ever imported it. Keeping it lets a restore update that object
  # instead of storing a second template under the same name next to it.
  '["ServiceTemplate"]["tpl-service-cert-no-agent"]["uuid"]': 'ed9802cd-54f2-4c55-8f7a-5c5ddb92c27f'
