variants:
  - linux

overwrites:
  '["ServiceTemplate"]["tpl-service-huawei-pacific-power"]["check_interval"]': 300
  '["ServiceTemplate"]["tpl-service-huawei-pacific-power"]["retry_interval"]': 30
  '["ServiceTemplate"]["tpl-service-huawei-pacific-power"]["use_agent"]': false
  '["ServiceTemplate"]["tpl-service-huawei-pacific-power"]["vars"]["criticality"]': 'A'
  # The node name alone does not order a spare part. Carrying the chassis serial
  # number in the service output means a power supply can be identified from the
  # notification, without logging in to the appliance first.
  '["ServiceTemplate"]["tpl-service-huawei-pacific-power"]["vars"]["huawei_pacific_power_lengthy"]': true
