---
overwrites:
  # A lost path is a reason to act, so this sits in the same criticality band as the
  # other storage checks.
  '["ServiceTemplate"]["tpl-service-multipath"]["enable_perfdata"]': true
  '["ServiceTemplate"]["tpl-service-multipath"]["retry_interval"]': 60
  '["ServiceTemplate"]["tpl-service-multipath"]["vars"]["criticality"]': 'A'
