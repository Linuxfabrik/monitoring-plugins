---
overwrites:
  # A lost path is a reason to act, so this sits in the same criticality band as the
  # other storage checks. --lengthy is on, because the extra columns carry the WWID and
  # the device-mapper device, which is what identifies a LUN once something is wrong
  # with it; a host holds few enough maps that the output stays readable.
  '["ServiceTemplate"]["tpl-service-multipath"]["enable_perfdata"]': true
  '["ServiceTemplate"]["tpl-service-multipath"]["retry_interval"]': 60
  '["ServiceTemplate"]["tpl-service-multipath"]["vars"]["criticality"]': 'A'
  '["ServiceTemplate"]["tpl-service-multipath"]["vars"]["multipath_lengthy"]': true
