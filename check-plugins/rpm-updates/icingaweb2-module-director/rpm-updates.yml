---
overwrites:
  # --timeout applies to each of the up to three yum calls (list --upgrades, list
  # --installed, updateinfo), so the command needs 3 x 120 seconds plus some headroom.
  # A lower value lets the monitoring server kill a check on a host with a slow mirror.
  '["Command"]["cmd-check-rpm-updates"]["timeout"]': 400
  '["ServiceTemplate"]["tpl-service-rpm-updates"]["check_interval"]': 86400
  '["ServiceTemplate"]["tpl-service-rpm-updates"]["retry_interval"]': 60
  '["ServiceTemplate"]["tpl-service-rpm-updates"]["vars"]["rpm_updates_grace_security"]': '0D'
  '["ServiceTemplate"]["tpl-service-rpm-updates"]["vars"]["rpm_updates_grace_updates"]': '8D'
