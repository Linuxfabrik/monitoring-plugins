---
overwrites:
  # --timeout applies to each of the two apt calls (apt-get update, apt list), so the
  # command needs 2 x 60 seconds plus some headroom. A lower value lets the monitoring
  # server kill a check on a host with a slow mirror.
  '["Command"]["cmd-check-deb-updates"]["timeout"]': 150
  '["ServiceTemplate"]["tpl-service-deb-updates"]["check_interval"]': 86400
  '["ServiceTemplate"]["tpl-service-deb-updates"]["retry_interval"]': 60
  '["ServiceTemplate"]["tpl-service-deb-updates"]["vars"]["deb_updates_grace_security"]': '0D'
  '["ServiceTemplate"]["tpl-service-deb-updates"]["vars"]["deb_updates_grace_updates"]': '8D'
