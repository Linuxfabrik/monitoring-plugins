overwrites:
  # The account listing behind --top answers slower the more accounts the instance has,
  # and slowest of all on the first run after a batch of accounts was created, when it
  # still has to materialise their home directories. The plugin caps itself at
  # --top-timeout (240s by default), so this leaves it room to report that rather than
  # being killed halfway through.
  '["Command"]["cmd-check-nextcloud-stats"]["timeout"]': 300
  '["ServiceTemplate"]["tpl-service-nextcloud-stats"]["check_interval"]': 900
  '["ServiceTemplate"]["tpl-service-nextcloud-stats"]["enable_perfdata"]': true
