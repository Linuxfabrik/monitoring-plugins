apiVersion: grizzly.grafana.com/v1alpha1
kind: Dashboard
metadata:
  folder: linuxfabrik-monitoring-plugins
  name: kvm-memory-usage
spec:
  schemaVersion: 42
  tags:
    - Linuxfabrik
    - Grizzly
    - static
  time:
    from: now-90d
    to: now
  timepicker:
    hidden: false
    refresh_intervals:
    - 1m
  timezone: browser
  title: kvm-memory-usage
  editable: true
  liveNow: true
  refresh: 1m
  templating:
    list:
    - label: Command
      name: command
      query: SHOW MEASUREMENTS WITH MEASUREMENT =~ /.*kvm-memory-usage.*/
      current:
        text: cmd-check-kvm-memory-usage
        value: cmd-check-kvm-memory-usage
      refresh: 1
      sort: 1
      type: query
    - label: Hostname
      name: hostname
      query: SHOW TAG VALUES FROM "$command" WITH KEY = "hostname"
      refresh: 1
      sort: 1
      type: query
    - label: Service
      name: service
      query: SHOW TAG VALUES FROM "$command" WITH KEY = "service" WHERE hostname = '$hostname'
      refresh: 1
      sort: 1
      type: query

  panels:

  # How full each guest operating system is, in percent of the memory it sees.
  # Machines of different sizes are comparable here, which they are not in the
  # panel below, and this is the figure the thresholds judge.
  - title: kvm-memory-usage - Guest Memory Usage per Virtual Machine
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 0
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 1
          showPoints: never
          spanNulls: false
        decimals: 1
        min: 0
        max: 100
        unit: percent
    options:
      legend:
        calcs:
        - first
        - min
        - mean
        - max
        - last
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        mode: multi
        sort: none

    transformations:
    - id: renameByRegex
      options:
        regex: (.*)_memory_usage$
        renamePattern: $1

    targets:

    - alias: $tag_metric
      refId: usage
      groupBy:
      - params:
        - $interval
        type: time
      - params:
        - previous
        type: fill
      - params:
        - metric
        type: tag
      measurement: $command
      resultFormat: time_series
      select:
      - - params:
          - value
          type: field
        - params: []
          type: mean
      tags:
      - key: hostname
        operator: '='
        value: $hostname
      - condition: AND
        key: service
        operator: '='
        value: $service
      - condition: AND
        key: metric
        operator: '=~'
        value: /_memory_usage$/

  # The same machines in absolute figures, which is a different scale from the
  # percentages above and therefore a panel of its own. Three lines per machine:
  # what it was given, what the guest cannot free, and what it really occupies on
  # the host. The gap between the first and the last is the memory the host has
  # promised but not yet had to hand over.
  - title: kvm-memory-usage - Memory per Virtual Machine
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 8
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 1
          showPoints: never
          spanNulls: false
        decimals: 1
        min: 0
        unit: bytes
    options:
      legend:
        calcs:
        - first
        - min
        - mean
        - max
        - last
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        mode: multi
        sort: none

    targets:

    - alias: $tag_metric
      refId: permachine
      groupBy:
      - params:
        - $interval
        type: time
      - params:
        - previous
        type: fill
      - params:
        - metric
        type: tag
      measurement: $command
      resultFormat: time_series
      select:
      - - params:
          - value
          type: field
        - params: []
          type: mean
      tags:
      - key: hostname
        operator: '='
        value: $hostname
      - condition: AND
        key: service
        operator: '='
        value: $service
      - condition: AND
        key: metric
        operator: '=~'
        value: /(_memory_assigned$|_memory_host$|_memory_used$)/

  # The host's side of the same story: how much memory it has, how much it has
  # promised to the machines that are running, and how much of it those machines
  # actually occupy. Kept apart from the per-machine panel because these are host
  # totals and would otherwise dwarf the individual machines on the same axis.
  - title: kvm-memory-usage - Host Memory
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 16
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 1
          showPoints: never
          spanNulls: false
        decimals: 1
        min: 0
        unit: bytes
    options:
      legend:
        calcs:
        - first
        - min
        - mean
        - max
        - last
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        mode: multi
        sort: none

    targets:

    - alias: $tag_metric
      refId: host
      groupBy:
      - params:
        - $interval
        type: time
      - params:
        - previous
        type: fill
      - params:
        - metric
        type: tag
      measurement: $command
      resultFormat: time_series
      select:
      - - params:
          - value
          type: field
        - params: []
          type: mean
      tags:
      - key: hostname
        operator: '='
        value: $hostname
      - condition: AND
        key: service
        operator: '='
        value: $service
      - condition: AND
        key: metric
        operator: '=~'
        value: /(^memory_assigned$|^memory_host_total$|^memory_host_used$)/

  # The share of the host's memory promised to the machines that are running.
  # Deliberately without an upper bound: a line above 100% is the point of the
  # panel, and it says the host cannot honour all of its promises at once.
  - title: kvm-memory-usage - Host Memory Commitment
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 24
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          drawStyle: line
          lineInterpolation: linear
          lineWidth: 1
          showPoints: never
          spanNulls: false
        decimals: 1
        min: 0
        unit: percent
    options:
      legend:
        calcs:
        - first
        - min
        - mean
        - max
        - last
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        mode: multi
        sort: none

    targets:

    - alias: $tag_metric
      refId: commitment
      groupBy:
      - params:
        - $interval
        type: time
      - params:
        - previous
        type: fill
      - params:
        - metric
        type: tag
      measurement: $command
      resultFormat: time_series
      select:
      - - params:
          - value
          type: field
        - params: []
          type: mean
      tags:
      - key: hostname
        operator: '='
        value: $hostname
      - condition: AND
        key: service
        operator: '='
        value: $service
      - condition: AND
        key: metric
        operator: '=~'
        value: /^memory_commitment$/
