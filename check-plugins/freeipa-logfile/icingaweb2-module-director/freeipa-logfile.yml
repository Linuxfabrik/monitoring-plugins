---
# The result file is world-readable (0644 in a 0755 directory, as the RPM and the
# Debian package ship it), so the check needs no sudo.
variants:
  - linux

overwrites:
  # ipa-healthcheck runs once a day, so an hourly look at its result is plenty.
  '["ServiceTemplate"]["tpl-service-freeipa-logfile"]["check_interval"]': '3600'
  '["ServiceTemplate"]["tpl-service-freeipa-logfile"]["enable_perfdata"]': true
