---
overwrites:
  # The answer changes on a reboot, a microcode or kernel update and a change to the
  # kernel command line, and at no other time, so once a day is often enough.
  '["ServiceTemplate"]["tpl-service-cpu-vulnerabilities"]["check_interval"]': 86400
  '["ServiceTemplate"]["tpl-service-cpu-vulnerabilities"]["enable_perfdata"]': true
  '["ServiceTemplate"]["tpl-service-cpu-vulnerabilities"]["retry_interval"]': 3600
