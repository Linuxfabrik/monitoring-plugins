---
# The report is readable by root only.
variants:
  - linux
  - sudo

overwrites:
  # AIDE checks the host a few times a day, so an hourly look at its report is plenty.
  '["ServiceTemplate"]["tpl-service-aide-logfile"]["check_interval"]': '3600'
  '["ServiceTemplate"]["tpl-service-aide-logfile"]["enable_perfdata"]': true
