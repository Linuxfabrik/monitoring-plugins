[tox]
envlist = py39, py310, py311, py312, py313, py314
skip_missing_interpreters = true
# this repo is not a Python package - it is a collection of check plugin scripts.
# tell tox not to build/install an sdist from the repo root, otherwise setuptools
# auto-discovery trips over the top-level lib/, site/ and assets/ dirs.
no_package = true

[testenv]
# Each environment installs the hash-pinned lockfile of its Python version, so
# the tests run against exactly the dependencies a source install ships with,
# and every runtime dependency is there: a plugin whose dependency was missing
# failed or skipped its tests without anyone noticing. The library itself is
# imported from the `lib` symlink next to each plugin, which points at the lib
# repo checked out beside this one, so the linuxfabrik-lib the lockfile installs
# stays unused.
deps =
    py39: -r lockfiles/py39/requirements.txt
    py310: -r lockfiles/py310/requirements.txt
    py311: -r lockfiles/py311/requirements.txt
    py312: -r lockfiles/py312/requirements.txt
    py313: -r lockfiles/py313/requirements.txt
    py314: -r lockfiles/py314/requirements.txt
commands =
    # `--no-container` keeps tox focused on fast pure-Python unit tests so
    # the multi-Python matrix actually completes. Run `tools/run-container-tests`
    # separately for the container-backed integration suite (podman required).
    python tools/run-unit-tests --no-container {posargs}
